[tool.poetry]
name = "f1-nexus-backend"
version = "0.1.0"
description = "F1 Nexus - Formula 1 intelligence platform backend"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
python-multipart = "^0.0.9"

# Database
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
psycopg2-binary = "^2.9.9"

# Settings
pydantic-settings = "^2.2.0"
python-dotenv = "^1.0.0"

# F1 data
fastf1 = ">=3.3.0"
pandas = ">=2.0.0"
numpy = ">=1.26.0"

# ML
scikit-learn = ">=1.4.0"
xgboost = ">=2.0.0"
joblib = ">=1.3.0"
statsmodels = "^0.14.0"

# Firebase / Firestore
firebase-admin = "^6.5.0"

# LLM providers (all optional - loaded only if their provider is selected)
groq = "^0.9.0"
google-generativeai = "^0.7.0"
anthropic = "^0.28.0"

# Notifications
pywebpush = "^2.0.0"
python-telegram-bot = "^21.3"

# Async utilities
httpx = "^0.27.0"
anyio = "^4.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
