name: Auto-Seed F1 Nexus Database

on:
  schedule:
    # Run every Monday at 08:00 UTC (after global race weekends have concluded)
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allow manual triggers from the GitHub UI

jobs:
  seed_database:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v3
        id: cached-poetry-dependencies
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        working-directory: ./backend
        run: poetry install --no-interaction --no-root
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'

      - name: Create Cache Directory
        working-directory: ./backend
        run: mkdir -p cache

      - name: Run Auto-Seeder
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          poetry run python scripts/seed_data.py --year 2026
