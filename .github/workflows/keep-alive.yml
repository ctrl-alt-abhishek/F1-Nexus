name: Keep Render alive

# Pings the backend health endpoint every 13 minutes.
# Render free tier spins down after 15 minutes of inactivity (30-60s cold start).
# This stays within GitHub Actions' 2,000 free minutes/month limit.
# 
# Setup: Replace YOUR_RENDER_URL below with your actual Render deployment URL
#        after completing Week 5 deployment. Commit the updated URL.

on:
  schedule:
    - cron: '*/13 * * * *'
  workflow_dispatch:  # allow manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://YOUR_RENDER_URL.onrender.com/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: Health check returned $STATUS"
          fi
